version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentgov
      POSTGRES_PASSWORD: agentgov
      POSTGRES_DB: agentgov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agentgov:agentgov@db:5432/agentgov
    depends_on:
      - db

volumes:
  pgdata:
